name: Build Tata AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Install Android NDK and CMake
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Run local reasoning unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tata-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-signed-release:
    needs: build-debug
    runs-on: ubuntu-latest
    env:
      TATA_KEYSTORE_BASE64: ${{ secrets.TATA_KEYSTORE_BASE64 }}
      TATA_STORE_PASSWORD: ${{ secrets.TATA_STORE_PASSWORD }}
      TATA_KEY_ALIAS: ${{ secrets.TATA_KEY_ALIAS }}
      TATA_KEY_PASSWORD: ${{ secrets.TATA_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Install Android NDK and CMake
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Restore private release keystore
        if: ${{ env.TATA_KEYSTORE_BASE64 != '' && env.TATA_STORE_PASSWORD != '' && env.TATA_KEY_ALIAS != '' && env.TATA_KEY_PASSWORD != '' }}
        run: |
          printf '%s' "$TATA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tata-release.jks"
          test -s "$RUNNER_TEMP/tata-release.jks"

      - name: Build signed release APK
        if: ${{ env.TATA_KEYSTORE_BASE64 != '' && env.TATA_STORE_PASSWORD != '' && env.TATA_KEY_ALIAS != '' && env.TATA_KEY_PASSWORD != '' }}
        env:
          TATA_SIGNING_STORE_FILE: ${{ runner.temp }}/tata-release.jks
          TATA_SIGNING_STORE_PASSWORD: ${{ env.TATA_STORE_PASSWORD }}
          TATA_SIGNING_KEY_ALIAS: ${{ env.TATA_KEY_ALIAS }}
          TATA_SIGNING_KEY_PASSWORD: ${{ env.TATA_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload signed release APK
        if: ${{ env.TATA_KEYSTORE_BASE64 != '' && env.TATA_STORE_PASSWORD != '' && env.TATA_KEY_ALIAS != '' && env.TATA_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tata-ai-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Explain missing signing secrets
        if: ${{ env.TATA_KEYSTORE_BASE64 == '' || env.TATA_STORE_PASSWORD == '' || env.TATA_KEY_ALIAS == '' || env.TATA_KEY_PASSWORD == '' }}
        run: echo "Release signing belum dijalankan. Tambahkan empat GitHub Actions Secrets sesuai README."

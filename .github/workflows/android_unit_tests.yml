name: Tata Android Unit Tests

on:
  push:
    branches: [main, test/transformer-runtime-smoke]
    paths:
      - 'app/**'
      - 'onnx-poc/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android_unit_tests.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'onnx-poc/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android_unit_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Install Android NDK and CMake
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Run Android unit tests
        run: gradle testDebugUnitTest :onnx-poc:testDebugUnitTest --no-daemon

      - name: Build debug APK and isolated ONNX PoC AAR without publishing
        run: gradle assembleDebug :onnx-poc:assembleDebug --no-daemon

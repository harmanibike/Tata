name: Validate Tata local AI native engine

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build_local_llm_native.yml"
      - "docs/LOCAL_AI_ENGINE.md"
      - "app/src/main/cpp/**"
      - "app/src/main/java/com/harmanibike/voiceo3/LocalLlmEngine.kt"

permissions:
  contents: read

jobs:
  build-llama-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Tata
        uses: actions/checkout@v4

      - name: Install pinned NDK and CMake
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Checkout pinned llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 8e23278c7c36f4429fb237467d50e2935a91e655
          path: third_party/llama.cpp

      - name: Configure portable Android arm64 build
        run: |
          cmake -S third_party/llama.cpp -B build/llama-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF

      - name: Build llama.cpp shared library
        run: cmake --build build/llama-android --target llama --config Release --parallel 2

      - name: Verify Android shared libraries
        run: |
          find build/llama-android -type f -name "*.so" -print
          test -n "$(find build/llama-android -type f -name 'libllama.so' -print -quit)"

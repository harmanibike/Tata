name: Generate Tata AI Release Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Validate signing passwords
        env:
          STORE_PASSWORD: ${{ secrets.TATA_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TATA_KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Add TATA_STORE_PASSWORD and TATA_KEY_PASSWORD in repository Actions secrets first."
            exit 1
          fi

      - name: Generate release keystore
        env:
          STORE_PASSWORD: ${{ secrets.TATA_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TATA_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TATA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p output
          key_alias="${KEY_ALIAS:-tata-release}"
          keytool -genkeypair -v \
            -keystore output/tata-release.jks \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$key_alias" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Tata AI, OU=Android, O=Harmanibike, C=ID"
          keytool -list -keystore output/tata-release.jks -storepass "$STORE_PASSWORD"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: tata-release-keystore
          path: output/tata-release.jks
          retention-days: 1
          if-no-files-found: error

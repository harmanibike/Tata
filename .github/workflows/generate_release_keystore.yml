name: Generate Tata AI Release Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate private release keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$STORE_PASSWORD"
          keytool -genkeypair -v \
            -keystore output/tata-release.jks \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias tata-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Tata AI, OU=Android, O=Tata AI, C=ID"
          base64 -w 0 output/tata-release.jks > output/TATA_KEYSTORE_BASE64.txt
          {
            echo "TATA_STORE_PASSWORD=$STORE_PASSWORD"
            echo "TATA_KEY_PASSWORD=$KEY_PASSWORD"
            echo "TATA_KEY_ALIAS=tata-release"
            echo "TATA_KEYSTORE_BASE64 is in TATA_KEYSTORE_BASE64.txt"
          } > output/PRIVATE_CREDENTIALS.txt
          chmod 600 output/tata-release.jks output/TATA_KEYSTORE_BASE64.txt output/PRIVATE_CREDENTIALS.txt

      - name: Upload private keystore package
        uses: actions/upload-artifact@v4
        with:
          name: tata-ai-private-keystore
          path: output/
          retention-days: 1
          if-no-files-found: error
